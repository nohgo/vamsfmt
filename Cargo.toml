[package]
name = "vamsfmt"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Conservative stdin/stdout formatter for Verilog-A and Verilog-AMS"
license = "MIT"
readme = "README.md"
repository = "https://github.com/nohgo/vamsfmt"
include = ["/Cargo.toml", "/Cargo.lock", "/LICENSE", "/README.md", "/src/**", "/tests/**", "/docs/**", "/contrib/**", "/Makefile", "/scripts/**"]

[dependencies]
tree-sitter = "=0.26.13"
# Keep the shared grammar binding compatible with the declared Rust 1.85 floor.
tree-sitter-language = "=0.1.2"
tree-sitter-verilog-ams = { git = "https://github.com/nohgo/tree-sitter-verilog-ams.git", rev = "0b2672e76ff2941fb62081b5d42b0ae84a0f6c46" }

[profile.release]
lto = "thin"
strip = true
